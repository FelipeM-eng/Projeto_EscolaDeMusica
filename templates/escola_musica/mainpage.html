{% load static %}

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escola de Música LF</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'escola_musica/css/mainpage.css' %}">

    <link rel="stylesheet" href="{% static 'escola_musica/css/base.css' %}">
</head>

<body class="mainpage-body">

<section id="mainpage-hero"
         class="hero-scene"
         aria-label="Acessos rápidos">

    <div class="hero-scene__ambiente"
         id="hero-ambiente"
         aria-hidden="true">

        <div class="hero-scene__camada hero-scene__profundidade"></div>

        <div class="hero-scene__camada hero-scene__spot"></div>

        <div class="hero-scene__camada hero-scene__feixes"
             id="hero-feixes">

            <span class="hero-scene__feixe"></span>
            <span class="hero-scene__feixe"></span>
            <span class="hero-scene__feixe"></span>

        </div>

        <div class="hero-scene__camada hero-scene__chao"></div>

        <canvas class="hero-scene__po"
                id="hero-po"></canvas>

        <div class="hero-scene__camada hero-scene__vinheta"></div>

        <div class="hero-scene__camada hero-scene__grain"></div>
    </div>

    <div class="hero-scene__conteudo">

        <header class="hero-scene__cabecalho">

            <h1 class="hero-scene__titulo">
                Escola de Música
                
            </h1>
            <img
                src="{% static 'escola_musica/images/LogoDouradaSemFundo.webp' %}"
                alt="LF"
                class="navbar__logo-img"
            >

            <p class="hero-scene__subtitulo">
                Mural de acessos
            </p>

        </header>

        <div class="hero-scene__mural"
             id="hero-mural">

            <div class="hero-scene__mural-aurora"
                 aria-hidden="true"></div>

            <div>

                <p class="hero-scene__mural-legenda">
                    Toca no teu cartaz
                </p>

                <div class="hero-scene__cartazes">

                    <div class="hero-scene__holder"
                         data-url="{% url 'login_aluno' %}"
                         role="link"
                         tabindex="0"
                         aria-label="Login Aluno">

                        <span class="hero-scene__alfinete"
                              aria-hidden="true"></span>

                        <img src="{% static 'escola_musica/images/cartaz aluno.jpg' %}"
                             alt="Cartaz Login Aluno">
                    </div>

                    <div class="hero-scene__holder hero-scene__holder--destaque"
                         data-url="{% url 'login_professor' %}"
                         role="link"
                         tabindex="0"
                         aria-label="Login Professor">

                        <span class="hero-scene__alfinete"
                              aria-hidden="true"></span>

                        <img src="{% static 'escola_musica/images/cartaz professor.jpg' %}"
                             alt="Cartaz Login Professor">
                    </div>

                    <div class="hero-scene__holder"
                         data-url="{% url 'login' %}"
                         role="link"
                         tabindex="0"
                         aria-label="Login Administração">

                        <span class="hero-scene__alfinete"
                              aria-hidden="true"></span>

                        <img src="{% static 'escola_musica/images/cartaz administrador.jpg' %}"
                             alt="Cartaz Login Administração">
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script src="{% static 'escola_musica/js/mainpage.js' %}"></script>

</body>
</html>
