
<div class="mic-decorativo" aria-hidden="true" role="presentation">

  <!-- Ondas sonoras animadas -->
  <div class="mic-ondas">
    <span class="mic-onda mic-onda--1"></span>
    <span class="mic-onda mic-onda--2"></span>
    <span class="mic-onda mic-onda--3"></span>
  </div>

  <!-- Corpo do microfone em SVG puro -->
  <div class="mic-corpo">
    <svg viewBox="0 0 48 64"
         xmlns="http://www.w3.org/2000/svg"
         class="mic-svg"
         aria-hidden="true">
      <defs>
        <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="rgba(123,79,166,0.7)"/>
          <stop offset="100%" stop-color="rgba(201,168,76,0.4)"/>
        </linearGradient>
      </defs>

      <!-- Cápsula -->
      <rect x="14" y="2" width="20" height="32" rx="10"
            fill="url(#micGrad)"
            stroke="rgba(201,168,76,0.5)"
            stroke-width="1.5"/>

      <!-- Grade decorativa -->
      <line x1="14" y1="13" x2="34" y2="13"
            stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
      <line x1="14" y1="20" x2="34" y2="20"
            stroke="rgba(201,168,76,0.3)" stroke-width="1"/>
      <line x1="14" y1="27" x2="34" y2="27"
            stroke="rgba(201,168,76,0.3)" stroke-width="1"/>

      <!-- Braço -->
      <path d="M10 34 Q10 46 24 46 Q38 46 38 34"
            fill="none"
            stroke="rgba(201,168,76,0.6)"
            stroke-width="2"
            stroke-linecap="round"/>

      <!-- Haste -->
      <line x1="24" y1="46" x2="24" y2="57"
            stroke="rgba(201,168,76,0.6)"
            stroke-width="2"
            stroke-linecap="round"/>

      <!-- Base -->
      <rect x="13" y="57" width="22" height="5" rx="2.5"
            fill="rgba(201,168,76,0.35)"/>
    </svg>
  </div>

  <!-- Glow pulsante -->
  <div class="mic-glow"></div>

</div>
